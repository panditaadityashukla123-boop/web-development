<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
    <body>
            <h1 align="center"><B><I><U>Pete's Pizza delivery</U></I></B></h1>
            <h2 align="center"><B><I><U>Online Order Form </U></I></B></h2>
            <h3 align="center"><B><I>* required field</I></B></h3>
            <form action="welcome page.html">
                <fieldset>
                    <legend>Customer Details</legend>
                        <table>
                            <tr>
                               <td><label for="name">*Name:</label></td>
                               <td><input type="text" id="name" placeholder="enter your name" required></td>
                            </tr>
                            <tr>
                                <td><label for="adress">*Adress:</label></td>
                                <td><input type="text" id="adress" placeholder="enter your adress" required></td>
                            </tr>
                            <tr>
                                <td><label for="city">*Town/City:</label></td>
                                <td><input type="text" id="city" placeholder="enter your city" required></td>
                            </tr>
                            <tr>
                                <td><label for="pincode">*Pincode:</label></td>
                                <td><input type="number" id="picode" placeholder="enter your pincode" maxlength="6" min="0" required></td>
                            </tr>
                            <tr>
                                <td><label for="telephone">*Tel:</label></td>
                                <td><input type="number" id="telephone" placeholder="enter your telephone no." required></td>
                            </tr>
                            <tr>
                                <td><label for="email">*email:</label></td>
                                <td><input type="email" id="email" placeholder="enter your email" required></td>
                            </tr>
                        </table>
                </fieldset>
                <table width="100%">
                    <tr>
                        <td width="33%" valign="middle">
                            <fieldset>
                                <legend>Topping*</legend>
                                    <input type="radio" id="Mozzarella" name="Mozzarella" required>
                                    <label for="Mozzarella">Mozzarella</label>
                                <br>
                                    <input type="radio" id="aged cheddar" name="Mozzarella" required>
                                    <label for="aged cheddar">Aged Cheddar</label>
                                <br>
                                    <input type="radio" id="sharp provolone" name="Mozzarella" required>
                                    <label for="sharp provolone">Sharp Provolone</label>
                                <br><br>
                            </fieldset>
                        </td>
                         <td width="33%" valign="middle">
                            <fieldset>
                                <legend>Size*</legend>
                                    <input type="radio" id="small" name="small" required>
                                    <label for="small">Small</label>
                                <br>
                                    <input type="radio" id="medium" name="small" required>
                                    <label for="medium">Medium</label>
                                <br>
                                    <input type="radio" id="large" name="small" required>
                                    <label for="large">Large</label>
                                <br><Br>
                            </fieldset>
                        </td>
                        <td width="33%" >
                            <fieldset  >
                                <legend>Extras</legend>
                                    <input type="radio" id="Mushrooms" name="Mushrooms" required>
                                    <label for="Mushrooms">Mushrooms</label>
                                <br>
                                    <input type="radio" id="Greenpeppers" name="Mushrooms" required>
                                    <label for="Greenpeppers">Greenpeppers</label>
                                <br>
                                    <input type="radio" id="sharp provolone" name="Mushrooms" required>
                                    <label for="Garlic Butter">Garlic Butter</label>
                                <br>
                                    <input type="radio" id="Extra Cheese" name="Mushrooms" required>
                                    <label for="Extra Cheese">Extra Cheese</label>
                                
                            </fieldset>
                        </td>
                        
                    </tr>
                </table>
                        <fieldset>
                            <legend>Delivery</legend>
                                    <label for="time">Preferred delivery time:</label>
                                    <input type="time" id="time">
                                <BR><BR>
                                    <p for="instruction">Delivery instructions:</p>
                                    <input type="text" id="instructions" size="50%" >
                        </fieldset>
                <button>Submit form</button>
                    
            </form>
    </body>
</html>
