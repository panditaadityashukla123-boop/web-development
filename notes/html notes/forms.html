<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Forms</h1> 
    <div>
        <form action="https://google.com" target="_blank">
            <fieldset bordercolor="black">
                <legend>Enter your Basic Information</legend>
                <label for="Fullname">Full name :</label>
                <input type="text" id="Fullname" placeholder="enter your name" required>

            <br><br>
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="enter your email" required>

            <br><br>
                <label for="password">Password:</label>
                <input type="password" id="password" placeholder="enter your password" required>

            <br><br>
                <label for="checkbox">Are you 18+ ?:</label>
                <input type="checkbox" id="checkbox" required>

            <br><br>
                <label for="number">phone no.:</label>
                <input type="number" id="number" placeholder="enter your number" required maxlength="10" min="0">

            <BR><BR>
                 <label for="gender">gender:</label>
                 <label for="gender">male</label>
                 <input type="radio" id="gender" name="gender" required>
                 <label for="Gender">female</label>
                 <input type="radio" id="Gender" name="gender" required>

            <br><BR>
                <label for="date">Enter your DOB:</label>
                <input type="date" id="date" required>

            <BR><BR>
                <label for="file">Upload Photo:</label>
                <input type="file" id="file"required >

            <BR><BR>
                <label for="city">select your city:</label>
                <select name="city" id="city" required>
                    <option value="delhi">Delhi</option>
                    <option value="mumbai">Mumbai</option>
                    <option value="noida">Noida</option>
                    <option value="kolkata">Kolkata</option>
                    <option value="jaipur">Jaipur</option>
                    <option value="Raigarh">Raigarh</option>
                </select>

            <BR><BR>
                <button type="submit">submit form</button>
            </fieldset>
        </form>
    </div>
    
</body>
</html>
